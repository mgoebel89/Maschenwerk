# nginx-Site von Maschenwerk. __HTTP_PORT__ / __HTTPS_PORT__ / __HTTPS_SUFFIX__ ersetzt der Installer.
#
# HTTPS ist hier Pflicht: „Bildschirm bleibt an" (Wake Lock) im Strickmodus und die
# Installation als App am Handy gibt es im Browser nur in einem "secure context".

server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name _;
    location / {
        return 301 https://$host__HTTPS_SUFFIX__$request_uri;
    }
}

server {
    # http2 als listen-Parameter, NICHT als eigene Direktive: `http2 on;` gibt es
    # erst ab nginx 1.25.1, Debian 12 liefert 1.22.
    listen __HTTPS_PORT__ ssl http2 default_server;
    listen [::]:__HTTPS_PORT__ ssl http2 default_server;
    server_name _;

    root /var/www/maschenwerk;
    index index.html;

    ssl_certificate     /etc/ssl/maschenwerk/server.crt;
    ssl_certificate_key /etc/ssl/maschenwerk/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # App-Code NICHT cachen — sonst zeigt ein Update scheinbar keine Wirkung.
    location ~* \.(html|js|css|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
}
